name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'react-native/habitat-ledger/client/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          SDK=/usr/local/lib/android/sdk
          export ANDROID_HOME=$SDK
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        working-directory: react-native/habitat-ledger/client
        run: npm install

      - name: Generate native Android project
        working-directory: react-native/habitat-ledger/client
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: react-native/habitat-ledger/client/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: habitat-ledger-debug
          path: react-native/habitat-ledger/client/android/app/build/outputs/apk/debug/*.apk
