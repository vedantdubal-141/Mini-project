<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Super Over</title>
    <link rel="stylesheet" href="superover.css">
</head>
<body>
<div class="game-container">

    <div class="scorecards-row">

        <div class="score-block blue">
            <h2 class="team-name">IND</h2>

            <div class="runs-display">
                <span class="ball-score">4</span>
                <span class="ball-score">3</span>
                <span class="ball-score">2</span>
                <span class="ball-score">6</span>
                <span class="ball-score">6</span>
                <span class="ball-score">6</span>
            </div>

            <p class="total-score">27 / 0</p>
        </div>

        <div class="score-block green">
            <h2 class="team-name">PAK</h2>

            <div class="runs-display">
                <span class="ball-score">2</span>
                <span class="ball-score">4</span>
                <span class="ball-score">0</span>
                <span class="ball-score">3</span>
                <span class="ball-score">1</span>
                <span class="ball-score">4</span>
            </div>

            <p class="total-score">14 / 0</p>
        </div>

    </div>

    <div class="buttons-row">
        <div class="button-icon bat-button">
        </div>
        <div class="button-icon reload-button">
        </div>
    </div>

</div>
</body>
</html>
